name: Apply compile fix
on:
  pull_request:
    types: [synchronize, opened, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/fix-geofence
          fetch-depth: 1
      - name: Fix AnimatedVisibility scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/symdev/netswitch/ui/NetSwitchScreen.kt')
          s = p.read_text(encoding='utf-8-sig')
          s = s.replace('import androidx.compose.animation.AnimatedVisibility\n', '', 1)
          old = '''                    val sel = ui.selected
                    AnimatedVisibility(visible = sel != null, modifier = Modifier.align(Alignment.BottomCenter)) {
                        Surface(Modifier.padding(10.dp), shape = RoundedCornerShape(12.dp), color = CardHigh.copy(alpha = 0.97f), border = BorderStroke(1.dp, Teal.copy(alpha = 0.6f))) {'''
          new = '''                    val sel = ui.selected
                    if (sel != null) {
                        Box(Modifier.fillMaxWidth(), contentAlignment = Alignment.BottomCenter) {
                        Surface(Modifier.padding(10.dp), shape = RoundedCornerShape(12.dp), color = CardHigh.copy(alpha = 0.97f), border = BorderStroke(1.dp, Teal.copy(alpha = 0.6f))) {'''
          if old in s:
              s = s.replace(old, new, 1)
              old_end = '''                        }
                    }
                }
            }

            Surface(shape = RoundedCornerShape(16.dp), color = Card, border = BorderStroke(1.dp, Line)) {'''
              new_end = '''                        }
                        }
                    }
                }
            }

            Surface(shape = RoundedCornerShape(16.dp), color = Card, border = BorderStroke(1.dp, Line)) {'''
              if old_end not in s:
                  raise SystemExit('target end not found')
              s = s.replace(old_end, new_end, 1)
              p.write_text(s, encoding='utf-8')
              print('AnimatedVisibility compile fix applied')
          elif 'AnimatedVisibility' not in s:
              print('Compile fix already applied')
          else:
              raise SystemExit('target start not found')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/symdev/netswitch/ui/NetSwitchScreen.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: resolve AnimatedVisibility scope compile error'
          git push origin HEAD:review/fix-geofence
